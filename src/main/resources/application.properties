spring.application.name=appointment-system

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/appointment_management_system}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.initialization-fail-timeout=-1

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=false

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${EMAIL_USERNAME}

# Application
app.base-url=${APP_BASE_URL:http://localhost:8080}

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
#app.upload.dir=${user.home}/appointment-uploads
app.upload.dir=${UPLOAD_DIR:/app/uploads}

#Session
server.servlet.session.timeout=30m

# Sonar
sonar.projectKey=appointment-system
sonar.projectName=Appointment Management System
sonar.host.url=http://localhost:9000
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml