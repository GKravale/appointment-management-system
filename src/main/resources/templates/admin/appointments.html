<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>All Appointments</title></head>
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">All appointments</h2>
        <a th:href="@{/admin/dashboard}"
           class="btn btn-sm btn-outline-secondary">Back</a>
    </div>

    <form th:action="@{/admin/appointments}" method="get"
          class="row g-3 mb-4">
        <div class="col-md-4">
            <label class="form-label">Status</label>
            <select name="status" class="form-select">
                <option value="">All statuses</option>
                <option th:each="s : ${statuses}"
                        th:value="${s}"
                        th:text="${s}"
                        th:selected="${selectedStatus == s.name()}"></option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label">Provider name</label>
            <input type="text" name="providerName"
                   class="form-control"
                   th:value="${selectedProvider}"
                   placeholder="Search by provider name"/>
        </div>
        <div class="col-md-2 d-flex align-items-end">
            <button type="submit" class="btn btn-primary w-100">Filter</button>
        </div>
        <div class="col-md-2 d-flex align-items-end">
            <a th:href="@{/admin/appointments}"
               class="btn btn-outline-secondary w-100">Clear</a>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>Client</th>
                <th>Provider</th>
                <th>Service</th>
                <th>Date & Time</th>
                <th>Duration</th>
                <th>Status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="apt : ${appointments}">
                <td th:text="${apt.clientFirstName + ' ' +
                                  apt.clientLastName}"></td>
                <td th:text="${apt.providerFirstName + ' ' +
                                  apt.providerLastName}"></td>
                <td th:text="${apt.serviceTitleSnapshot}"></td>
                <td th:text="${#temporals.format(apt.startTime,
                                 'dd MMM yyyy HH:mm')}"></td>
                <td th:text="${apt.durationAtBooking + ' min'}"></td>
                <td>
                        <span class="badge"
                              th:classappend="${apt.status.name() == 'CONFIRMED'}
                                              ? 'bg-success'
                                              : (${apt.status.name() == 'REQUESTED'}
                                                 ? 'bg-warning text-dark'
                                                 : (${apt.status.name() == 'COMPLETED'}
                                                    ? 'bg-primary' : 'bg-secondary'))"
                              th:text="${apt.status}"></span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
