<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Service Catalogue</title></head>
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Service catalogue</h2>
        <a th:href="@{/admin/dashboard}"
           class="btn btn-sm btn-outline-secondary">Back</a>
    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>Title</th>
                <th>Category</th>
                <th>Default duration</th>
                <th>Price estimate</th>
                <th>Booking type</th>
                <th>Status</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="service : ${services}">
                <td th:text="${service.title}"></td>
                <td th:text="${service.category}"></td>
                <td th:text="${service.defaultDuration + ' min'}"></td>
                <td th:text="${service.priceEstimate ?: '—'}"></td>
                <td th:text="${service.bookingType}"></td>
                <td>
                        <span class="badge"
                              th:classappend="${service.isActive}
                                              ? 'bg-success' : 'bg-secondary'"
                              th:text="${service.isActive}
                                        ? 'Active' : 'Inactive'"></span>
                </td>
                <td>
                    <form th:if="${service.isActive}"
                          th:action="@{/admin/services/{id}/deactivate
                                         (id=${service.id})}"
                          method="post" class="d-inline">
                        <button class="btn btn-sm btn-outline-danger">
                            Deactivate
                        </button>
                    </form>
                    <form th:unless="${service.isActive}"
                          th:action="@{/admin/services/{id}/activate
                                         (id=${service.id})}"
                          method="post" class="d-inline">
                        <button class="btn btn-sm btn-outline-success">
                            Activate
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
