<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Providers</title></head>
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Providers</h2>
        <a th:href="@{/admin/dashboard}"
           class="btn btn-sm btn-outline-secondary">Back to dashboard</a>
    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Username</th>
                <th>Status</th>
                <th>Registered</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${providers}">
                <td th:text="${user.person.firstName + ' ' +
                                  user.person.lastName}"></td>
                <td th:text="${user.email}"></td>
                <td th:text="${user.username}"></td>
                <td>
                        <span class="badge"
                              th:classappend="${user.accountStatus.name() == 'ACTIVE'}
                                              ? 'bg-success'
                                              : (${user.accountStatus.name() == 'PENDING'}
                                                 ? 'bg-warning text-dark' : 'bg-danger')"
                              th:text="${user.accountStatus}"></span>
                </td>
                <td th:text="${#temporals.format(user.createdAt,
                                 'dd MMM yyyy')}"></td>
                <td>
                    <div class="d-flex gap-2">
                        <form th:if="${user.accountStatus.name() != 'ACTIVE'}"
                              th:action="@{/admin/providers/{id}/approve(id=${user.id})}"
                              method="post">
                            <button class="btn btn-sm btn-success">Approve</button>
                        </form>
                        <form th:if="${user.accountStatus.name() != 'SUSPENDED'}"
                              th:action="@{/admin/providers/{id}/suspend(id=${user.id})}"
                              method="post"
                              onsubmit="return confirm('Suspend this provider?')">
                            <button class="btn btn-sm btn-outline-danger">Suspend</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
