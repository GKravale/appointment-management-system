<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Change Password</title></head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h4 class="card-title mb-4">Change password</h4>

                    <form th:action="@{/auth/change-password}"
                          th:object="${changeRequest}" method="post">

                        <div class="mb-3">
                            <label for="currentPassword" class="form-label">
                                Current password
                            </label>
                            <input type="password" id="currentPassword"
                                   th:field="*{currentPassword}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('currentPassword')}
                                                    ? 'is-invalid'"
                                   autofocus/>
                            <div class="invalid-feedback"
                                 th:errors="*{currentPassword}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="newPassword" class="form-label">
                                New password
                            </label>
                            <input type="password" id="newPassword"
                                   th:field="*{newPassword}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('newPassword')}
                                                    ? 'is-invalid'"/>
                            <div class="invalid-feedback"
                                 th:errors="*{newPassword}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">
                                Confirm new password
                            </label>
                            <input type="password" id="confirmPassword"
                                   th:field="*{confirmPassword}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('confirmPassword')}
                                                    ? 'is-invalid'"/>
                            <div class="invalid-feedback"
                                 th:errors="*{confirmPassword}"></div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                Change password
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
