<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Reset Password</title></head>
<body>
<div layout:fragment="content">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h4 class="card-title mb-4">Reset your password</h4>

          <form th:action="@{/auth/reset-password}"
                th:object="${resetRequest}" method="post">

            <input type="hidden" th:field="*{token}"
                   th:value="${token}"/>

            <div class="mb-3">
              <label for="password" class="form-label">
                New password
              </label>
              <input type="password" id="password"
                     th:field="*{password}"
                     class="form-control"
                     th:classappend="${#fields.hasErrors('password')}
                                                    ? 'is-invalid'"/>
              <div class="invalid-feedback"
                   th:errors="*{password}"></div>
            </div>

            <div class="mb-3">
              <label for="confirmPassword" class="form-label">
                Confirm new password
              </label>
              <input type="password" id="confirmPassword"
                     th:field="*{confirmPassword}"
                     class="form-control"
                     th:classappend="${#fields.hasErrors('confirmPassword')}
                                                    ? 'is-invalid'"/>
              <div class="invalid-feedback"
                   th:errors="*{confirmPassword}"></div>
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-primary">
                Reset password
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
