<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Resend Verification</title></head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card">
                <div class="card-body p-4">
                    <h4 class="mb-3">Resend verification email</h4>
                    <p class="text-muted small mb-4">
                        Enter your email address and we will send you a new verification link.
                    </p>
                    <div th:if="${errorMessage}" class="alert alert-danger"
                         th:text="${errorMessage}"></div>

                    <form th:action="@{/auth/resend-verification}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>
                        <div class="mb-3">
                            <label class="form-label">Email address</label>
                            <input type="email" name="email" class="form-control" required/>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Send</button>
                    </form>
                    <div class="text-center mt-3">
                        <a th:href="@{/auth/login}" class="small">Back to login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
