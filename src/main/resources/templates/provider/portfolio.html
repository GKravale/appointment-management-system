<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>My Portfolio</title></head>
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">My portfolio</h2>
        <a th:href="@{/provider/posts}"
           class="btn btn-outline-primary btn-sm">
            <i class="bi bi-file-post me-1"></i>Manage posts
        </a>
    </div>

    <div class="card mb-4">
        <div class="card-header">
            <h6 class="mb-0">Upload image</h6>
        </div>
        <div class="card-body">
            <form th:action="@{/provider/portfolio/upload}"
                  method="post" enctype="multipart/form-data">
                <div class="row g-3 align-items-end">
                    <div class="col-md-5">
                        <label class="form-label">
                            Image file
                            <small class="text-muted">(jpg, png, webp)</small>
                        </label>
                        <input type="file" name="file"
                               class="form-control"
                               accept="image/*" required
                               aria-label="Select image"/>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label">
                            Caption
                            <small class="text-muted">(optional)</small>
                        </label>
                        <input type="text" name="altText"
                               class="form-control"/>
                    </div>
                    <div class="col-md-2">
                        <button type="submit"
                                class="btn btn-primary w-100">
                            Upload
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(assets)}"
         class="text-center text-muted py-5">
        <i class="bi bi-images fs-1 d-block mb-3"></i>
        <p>No images uploaded yet.</p>
    </div>

    <div class="row g-3" th:unless="${#lists.isEmpty(assets)}">
        <div class="col-md-3" th:each="asset, stat : ${assets}">
            <div class="card h-100">
                <img th:src="@{/{p}(p=${asset.filePath})}"
                     th:alt="${asset.altText ?: 'Portfolio image'}"
                     class="card-img-top portfolio-thumb"
                     style="height:200px;object-fit:cover;cursor:pointer;"
                     th:data-index="${stat.index}"
                     th:data-src="@{/{p}(p=${asset.filePath})}"
                     th:data-alt="${asset.altText ?: ''}"
                     onclick="openLightbox(this)"/>
                <div class="card-body p-2">
                    <p class="text-muted small mb-2"
                       th:text="${asset.altText ?: ''}"></p>
                    <form th:action="@{/provider/portfolio/delete/{id}
                                     (id=${asset.id})}"
                          method="post">
                        <button type="submit"
                                class="btn btn-sm btn-outline-danger w-100"
                                onclick="return confirm('Delete this image?')"
                                aria-label="Delete image">
                            <i class="bi bi-trash me-1"></i>Delete
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="lightboxModal" tabindex="-1"
         aria-label="Image viewer">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content bg-dark">
                <div class="modal-header border-0">
                    <p class="text-white-50 mb-0" id="lightboxCaption"></p>
                    <button type="button" class="btn-close btn-close-white"
                            data-bs-dismiss="modal"
                            aria-label="Close"></button>
                </div>
                <div class="modal-body text-center p-0 position-relative d-flex
            align-items-center justify-content-center"
                     style="min-height:50vh;">
                    <button class="btn btn-dark position-absolute start-0
                   top-50 translate-middle-y ms-2 z-3"
                            id="prevBtn" onclick="changeImage(-1)"
                            aria-label="Previous">
                        <i class="bi bi-chevron-left"></i>
                    </button>
                    <img id="lightboxImg" src="" alt=""
                         class="img-fluid"
                         style="max-height:75vh;max-width:100%;object-fit:contain;"/>
                    <button class="btn btn-dark position-absolute end-0
                   top-50 translate-middle-y me-2 z-3"
                            id="nextBtn" onclick="changeImage(1)"
                            aria-label="Next">
                        <i class="bi bi-chevron-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

</div>
<th:block layout:fragment="scripts">
    <script th:inline="javascript">
        /*<![CDATA[*/
        const images = [];
        document.querySelectorAll('.portfolio-thumb').forEach(function (img) {
            images.push({src: img.dataset.src, alt: img.dataset.alt});
        });

        let currentIndex = 0;

        function openLightbox(el) {
            currentIndex = parseInt(el.dataset.index);
            updateLightbox();
            new bootstrap.Modal(document.getElementById('lightboxModal')).show();
        }

        function changeImage(direction) {
            currentIndex = (currentIndex + direction + images.length) % images.length;
            updateLightbox();
        }

        function updateLightbox() {
            document.getElementById('lightboxImg').src = images[currentIndex].src;
            document.getElementById('lightboxImg').alt = images[currentIndex].alt;
            document.getElementById('lightboxCaption').textContent =
                images[currentIndex].alt;
            document.getElementById('prevBtn').style.display =
                images.length > 1 ? '' : 'none';
            document.getElementById('nextBtn').style.display =
                images.length > 1 ? '' : 'none';
        }

        document.addEventListener('keydown', function (e) {
            if (!document.getElementById('lightboxModal')
                .classList.contains('show')) return;
            if (e.key === 'ArrowLeft') changeImage(-1);
            if (e.key === 'ArrowRight') changeImage(1);
        });
        /*]]>*/
    </script>
</th:block>
</body>
</html>
