<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Availability</title></head>
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">My availability</h2>
        <button class="btn btn-primary"
                data-bs-toggle="modal" data-bs-target="#addAvailabilityModal">
            <i class="bi bi-plus-lg me-1"></i>Add slot
        </button>
    </div>

    <div th:if="${#lists.isEmpty(availabilities)}"
         class="text-center text-muted py-5">
        <i class="bi bi-calendar-x fs-1 d-block mb-3"></i>
        <p>No availability set yet. Add your working hours so clients can book you.</p>
    </div>

    <div class="table-responsive" th:unless="${#lists.isEmpty(availabilities)}">
        <table class="table table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>Day</th>
                <th>From</th>
                <th>To</th>
                <th>Effective from</th>
                <th>Effective to</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="slot : ${availabilities}">
                <td th:text="${slot.dayOfWeek}"></td>
                <td th:text="${#temporals.format(slot.startTime, 'HH:mm')}"></td>
                <td th:text="${#temporals.format(slot.endTime, 'HH:mm')}"></td>
                <td th:text="${slot.effectiveFrom ?: '—'}"></td>
                <td th:text="${slot.effectiveTo ?: '—'}"></td>
                <td>
                    <form th:action="@{/provider/availability/delete/{id}(id=${slot.id})}"
                          method="post">
                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                onclick="return confirm('Remove this slot?')">
                            <i class="bi bi-trash"></i>
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="modal fade" id="addAvailabilityModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add availability</h5>
                    <button type="button" class="btn-close"
                            data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/provider/availability/create}"
                      th:object="${createRequest}" method="post">
                    <div class="modal-body">

                        <div class="mb-3">
                            <label class="form-label">Day of week</label>
                            <select th:field="*{dayOfWeek}" class="form-select"
                                    th:classappend="${#fields.hasErrors('dayOfWeek')} ? 'is-invalid'">
                                <option value="">Select day</option>
                                <option th:each="day : ${days}"
                                        th:value="${day}"
                                        th:text="${day}"></option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{dayOfWeek}"></div>
                        </div>

                        <div class="row mb-3">
                            <div class="col">
                                <label class="form-label">Start time</label>
                                <input type="time" th:field="*{startTime}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('startTime')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:errors="*{startTime}"></div>
                            </div>
                            <div class="col">
                                <label class="form-label">End time</label>
                                <input type="time" th:field="*{endTime}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('endTime')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:errors="*{endTime}"></div>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col">
                                <label class="form-label">
                                    Effective from
                                    <small class="text-muted">(optional)</small>
                                </label>
                                <input type="date" th:field="*{effectiveFrom}"
                                       class="form-control"/>
                            </div>
                            <div class="col">
                                <label class="form-label">
                                    Effective to
                                    <small class="text-muted">(optional)</small>
                                </label>
                                <input type="date" th:field="*{effectiveTo}"
                                       class="form-control"/>
                            </div>
                        </div>

                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary"
                                data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Add</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>
</body>
</html>
