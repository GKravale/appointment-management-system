<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Edit Service</title></head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Edit service</h5>
                    <a th:href="@{/provider/services}"
                       class="btn btn-sm btn-outline-secondary">Cancel</a>
                </div>
                <div class="card-body">
                    <form th:action="@{/provider/services/edit/{id}(id=${serviceId})}"
                          th:object="${editRequest}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input type="text" th:field="*{title}" class="form-control"
                                   th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:errors="*{title}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <select th:field="*{category}" class="form-select">
                                <option th:each="cat : ${categories}"
                                        th:value="${cat}"
                                        th:text="${cat}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Booking type</label>
                            <select th:field="*{bookingType}" class="form-select">
                                <option value="SLOT_BASED">
                                    Slot based — client picks a time
                                </option>
                                <option value="REQUEST_ONLY">
                                    Request only — provider contacts client
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea th:field="*{description}"
                                      class="form-control" rows="3"></textarea>
                        </div>

                        <div class="row mb-3">
                            <div class="col">
                                <label class="form-label">Duration (minutes)</label>
                                <input type="number" th:field="*{defaultDuration}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('defaultDuration')} ? 'is-invalid'"/>
                                <div class="invalid-feedback"
                                     th:errors="*{defaultDuration}"></div>
                            </div>
                            <div class="col">
                                <label class="form-label">Buffer (minutes)</label>
                                <input type="number" th:field="*{bufferMinutes}"
                                       class="form-control"/>
                            </div>
                            <div class="col">
                                <label class="form-label">Price estimate</label>
                                <input type="text" th:field="*{priceEstimate}"
                                       class="form-control" placeholder="e.g. 20-30€"/>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Save changes
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
