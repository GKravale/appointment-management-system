<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>My Schedule</title></head>
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">My schedule</h2>
        <div class="d-flex gap-3 align-items-center">
            <small>
                <span class="badge" style="background:#ffc107">&#9632;</span> Pending
            </small>
            <small>
                <span class="badge bg-primary">&#9632;</span> Confirmed
            </small>
            <small>
                <span class="badge bg-success">&#9632;</span> Completed
            </small>
            <a th:href="@{/provider/appointments}"
               class="btn btn-sm btn-outline-primary">
                List view
            </a>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div id="providerCalendar"></div>
        </div>
    </div>
    <div class="modal fade" id="appointmentModal" tabindex="-1"
         aria-labelledby="appointmentModalLabel">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="appointmentModalLabel">
                        Appointment details
                    </h5>
                    <button type="button" class="btn-close"
                            data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="modalBody"></div>
                <div class="modal-footer" id="modalFooter"></div>
            </div>
        </div>
    </div>

</div>
<th:block layout:fragment="scripts">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css"
          rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js">
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const calendar = new FullCalendar.Calendar(
                document.getElementById('providerCalendar'), {
                    initialView: 'timeGridWeek',
                    firstDay: 1,
                    headerToolbar: {
                        left: 'prev,next today',
                        center: 'title',
                        right: 'dayGridMonth,timeGridWeek,timeGridDay'
                    },
                    height: 'auto',
                    slotMinTime: '07:00:00',
                    slotMaxTime: '22:00:00',
                    allDaySlot: false,
                    events: '/provider/schedule/events',
                    eventClick: function(info) {
                        const props = info.event.extendedProps;
                        const start = info.event.start.toLocaleString('en-GB', {
                            weekday: 'long', day: 'numeric', month: 'long',
                            hour: '2-digit', minute: '2-digit'
                        });
                        const end = info.event.end ?
                            info.event.end.toLocaleTimeString('en-GB',
                                { hour: '2-digit', minute: '2-digit' }) : '';

                        document.getElementById('modalBody').innerHTML =
                            '<p><strong>' + info.event.title + '</strong></p>' +
                            '<p class="text-muted mb-1">' + start +
                            (end ? ' – ' + end : '') + '</p>' +
                            '<span class="badge bg-secondary">' +
                            props.status + '</span>';

                        const footer = document.getElementById('modalFooter');
                        footer.innerHTML = '';

                        if (props.status === 'REQUESTED') {
                            footer.innerHTML =
                                '<form method="post" action="/provider/appointments/' +
                                props.appointmentId + '/confirm" class="d-inline">' +
                                '<button class="btn btn-success btn-sm">Confirm</button>' +
                                '</form> ' +
                                '<form method="post" action="/provider/appointments/' +
                                props.appointmentId + '/decline" class="d-inline">' +
                                '<button class="btn btn-outline-danger btn-sm">Decline</button>' +
                                '</form>';
                        } else if (props.status === 'CONFIRMED') {
                            footer.innerHTML =
                                '<form method="post" action="/provider/appointments/' +
                                props.appointmentId + '/complete" class="d-inline">' +
                                '<button class="btn btn-outline-success btn-sm">' +
                                'Mark completed</button>' +
                                '</form>';
                        }

                        new bootstrap.Modal(
                            document.getElementById('appointmentModal')
                        ).show();
                    }
                });
            calendar.render();
        });
    </script>
</th:block>
</body>
</html>
