<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Browse Providers</title></head>
<body>
<div layout:fragment="content">

    <h2 class="mb-4">Browse providers</h2>

    <div class="d-flex flex-wrap gap-2 mb-4">
        <a th:href="@{/providers}"
           class="btn btn-sm"
           th:classappend="${selectedCategory == null} ? 'btn-primary' : 'btn-outline-primary'">
            All
        </a>
        <a th:each="cat : ${categories}"
           th:href="@{/providers(category=${cat})}"
           class="btn btn-sm"
           th:classappend="${selectedCategory == cat} ? 'btn-primary' : 'btn-outline-primary'"
           th:text="${cat}">
        </a>
    </div>

    <div th:if="${#lists.isEmpty(providers)}"
         class="text-center text-muted py-5">
        <i class="bi bi-people fs-1 d-block mb-3"></i>
        <p>No providers available yet.</p>
    </div>

    <div class="row g-4" th:unless="${#lists.isEmpty(providers)}">
        <div class="col-md-4" th:each="provider : ${providers}">
            <div class="card h-100">
                <div class="card-body">
                    <div class="d-flex align-items-center mb-3">
                        <div class="bg-secondary rounded-circle d-flex align-items-center
                                    justify-content-center me-3 flex-shrink-0"
                             style="width:48px;height:48px;">
                            <i class="bi bi-person-fill text-white"></i>
                        </div>
                        <div>
                            <h5 class="mb-0"
                                th:text="${provider.firstName + ' ' + provider.lastName}"></h5>
                            <small class="text-muted"
                                   th:text="${provider.location ?: 'Location not set'}"></small>
                        </div>
                    </div>
                    <p class="card-text text-muted small"
                       th:text="${provider.bio != null && provider.bio.length() > 100
                                  ? provider.bio.substring(0, 100) + '...'
                                  : (provider.bio ?: 'No bio yet')}"></p>
                </div>
                <div class="card-footer bg-transparent">
                    <a th:href="@{/providers/{id}(id=${provider.id})}"
                       class="btn btn-outline-primary btn-sm w-100">View profile</a>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
