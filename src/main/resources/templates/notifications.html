<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Notifications</title></head>
<body>
<div layout:fragment="content">
    <h2 class="mb-4">Notifications</h2>

    <div th:if="${#lists.isEmpty(notifications)}"
         class="text-center text-muted py-5">
        <i class="bi bi-bell-slash fs-1 d-block mb-3"></i>
        <p>No notifications yet.</p>
    </div>

    <div class="list-group" th:unless="${#lists.isEmpty(notifications)}">
        <a th:each="n : ${notifications}"
           th:href="${n.link ?: '#'}"
           class="list-group-item list-group-item-action"
           th:classappend="${!n.isRead} ? 'fw-semibold' : 'text-muted'">
            <div class="d-flex justify-content-between align-items-center">
                <span th:text="${n.message}"></span>
                <small th:text="${#temporals.format(n.createdAt, 'dd MMM HH:mm')}"></small>
            </div>
        </a>
    </div>
</div>
</body>
</html>
