<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Request Consultation</title></head>
<body>
<div layout:fragment="content">
  <div class="row justify-content-center">
    <div class="col-md-7">
      <div class="card">
        <div class="card-header">
          <h5 class="mb-0">Request a consultation</h5>
        </div>
        <div class="card-body">
          <div class="alert alert-info mb-4">
            <i class="bi bi-info-circle me-2"></i>
            This service requires a consultation before booking.
            Fill in the form and the provider will contact you
            to discuss details and arrange a time.
          </div>

          <div class="mb-4">
            <small class="text-muted d-block">Service</small>
            <span class="fw-semibold"
                  th:text="${service.title}"></span>
          </div>

          <form th:action="@{/client/request}" method="post">
            <input type="hidden" name="serviceId"
                   th:value="${service.id}"/>
            <input type="hidden" name="providerId"
                   th:value="${providerId}"/>

            <div class="mb-3">
              <label for="preferredDates" class="form-label">
                Preferred dates / times
              </label>
              <input type="text" id="preferredDates"
                     name="preferredDates"
                     class="form-control"
                     placeholder="e.g. Weekdays after 4pm, or Saturday mornings"/>
            </div>

            <div class="mb-3">
              <label for="description" class="form-label">
                What are you looking for?
              </label>
              <textarea id="description" name="description"
                        class="form-control" rows="5"
                        placeholder="Describe what you want, include any reference images links, size preferences, placement ideas etc.">
                            </textarea>
            </div>

            <div class="mb-4">
              <label for="contactPreference" class="form-label">
                Preferred contact method
              </label>
              <input type="text" id="contactPreference"
                     name="contactPreference"
                     class="form-control"
                     placeholder="e.g. Email, WhatsApp, phone call"/>
            </div>

            <button type="submit" class="btn btn-primary w-100">
              <i class="bi bi-send me-2"></i>Send request
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
