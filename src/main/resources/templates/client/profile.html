<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>My Profile</title></head>
<body>
<div layout:fragment="content">
    <div class="row">

        <div class="col-md-4 mb-4">
            <div class="card">
                <div class="card-body text-center py-4">
                    <div class="bg-secondary rounded-circle d-inline-flex
                                align-items-center justify-content-center mb-3"
                         style="width:80px;height:80px;">
                        <i class="bi bi-person-fill text-white fs-2"
                           aria-hidden="true"></i>
                    </div>
                    <h5 class="mb-0"
                        th:text="${profile.firstName + ' ' + profile.lastName}"></h5>
                    <small class="text-muted" th:text="${profile.phoneNr ?: 'No phone set'}"></small>
                    <small class="text-muted d-block mt-1" th:text="${profile.email}"></small>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">Edit profile</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/client/profile}"
                          th:object="${updateRequest}" method="post">

                        <div class="row mb-3">
                            <div class="col">
                                <label for="firstName" class="form-label">
                                    First name
                                </label>
                                <input type="text" id="firstName"
                                       th:field="*{firstName}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('firstName')}
                                                        ? 'is-invalid'"/>
                                <div class="invalid-feedback"
                                     th:errors="*{firstName}"></div>
                            </div>
                            <div class="col">
                                <label for="lastName" class="form-label">
                                    Last name
                                </label>
                                <input type="text" id="lastName"
                                       th:field="*{lastName}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('lastName')}
                                                        ? 'is-invalid'"/>
                                <div class="invalid-feedback"
                                     th:errors="*{lastName}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="phoneNr" class="form-label">
                                Phone number
                            </label>
                            <input type="text" id="phoneNr"
                                   th:field="*{phoneNr}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('phoneNr')}
                                                    ? 'is-invalid'"/>
                            <div class="invalid-feedback"
                                 th:errors="*{phoneNr}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="notes" class="form-label">
                                Notes
                                <small class="text-muted">(optional — allergies,
                                    preferences, etc.)</small>
                            </label>
                            <textarea id="notes" th:field="*{notes}"
                                      class="form-control" rows="3"
                                      placeholder="Anything providers should know...">
                            </textarea>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Save changes
                        </button>
                        <a th:href="@{/client/dashboard}"
                           class="btn btn-outline-secondary ms-2">Cancel</a>
                        <a th:href="@{/auth/change-password}"
                           class="btn btn-outline-secondary ms-2">
                            Change password
                        </a>
                    </form>
                </div>
            </div>
        </div>

    </div>
</div>
</body>
</html>
